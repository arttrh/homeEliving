spring.name=home&living
server.port=8080
spring.datasource.url=jdbc:mysql://${DB_URL}:${DB_PORT}/home_living
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Jpa configs
# Falando para o hibernate o seguinte (quero que você apenas valide as tabelas para ver se esta tudo correto)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
# exibição do sql no terminal / console
spring.jpa.show-sql=true
# resolvendo o problema de N+1 para consultas no banco de dados
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# flyway config
# ativando o flyway
spring.flyway.enabled=true
#Log de debug do flywry
logging.level.org.flywaydb=DEBUG
